name: CI

# Runs the checks in docs/dev/getting-started/pull-request.md#verification on
# every pull request and every push to main. The commands match that page, so
# a change that passes locally passes here, and the other way round. The E2E
# suite runs in five shards, so it adds about 6 minutes to a pull request.
#
# The two jobs that drive a browser (web and e2e) run in the official Playwright image, which
# already holds the browsers and their system libraries. Installing them with apt on every run
# was slow, and on a runner with a slow Ubuntu mirror it stalled for minutes. The image tag must
# match the Playwright version in web/package.json and e2e/package.json, so change the three
# together (the `container:` value cannot read env, so it is written out in both jobs).
#
# Every job runs on Linux (ubuntu-latest). GitHub's Apple Silicon runners are often short
# of capacity, and the jobs here do not need macOS: releases are built and signed on macOS
# in release.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# On a pull request or another branch, a newer commit cancels the run in progress, so only
# the latest commit is checked. On main a run is never cancelled: a newer push waits for
# it, so a quick series of merges still ends with a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_VERSION: "1.96.0"
  NEXTEST_VERSION: "0.9.137"
  LLVM_COV_VERSION: "0.9.1"
  NODE_VERSION: "24"
  PNPM_VERSION: "12"
  TZ: UTC
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_VERSION}"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      # The runner's toolchain does not live in ~/.cargo, so its bin folder is created and put on PATH.
      - name: Install cargo-nextest
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin" && echo "$bin" >> "$GITHUB_PATH"
          curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "$bin"
      # The binary embeds web/dist, so the web UI is built before any cargo command.
      - name: Build the web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked --no-fail-fast

  web:
    name: Web (typecheck, lint, unit, Storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Playwright image holds the Chromium the Storybook tests use.
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web check
      # Some unit tests check the built output (test/build-contract.test.ts).
      - run: pnpm --dir web build
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck:storybook
      # The Storybook tests run every Story in a headless Chromium (from the container image).
      - run: pnpm --dir web test:storybook
      - run: pnpm --dir web build-storybook

  # Coverage runs beside the jobs above, not in place of them: an instrumented
  # build is slower, and the pass/fail decision stays with the plain test runs.
  # Codecov shows the result; a fork's pull request has no token, so its upload
  # may fail without failing the run.
  coverage:
    name: Coverage (Rust, Web)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component llvm-tools-preview
          rustup default "${RUST_VERSION}"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: coverage
      - name: Install cargo-nextest and cargo-llvm-cov
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin" && echo "$bin" >> "$GITHUB_PATH" && export PATH="$bin:$PATH"
          curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "$bin"
          command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked --version "${LLVM_COV_VERSION}"
      - name: Build the web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      # Tests that start agpj with a cleared environment lose LLVM_PROFILE_FILE, so the child writes its
      # profile into the test's folder and a check that the folder is unchanged fails. The Rust job decides
      # pass or fail; here a failed test still leaves a report.
      - name: Measure the Rust coverage
        run: cargo llvm-cov nextest --locked --ignore-run-fail --lcov --output-path lcov.info
      - name: Measure the web coverage
        run: pnpm --dir web test:coverage
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # Builds the web UI and the CLI once for all E2E shards. The shards run in the Playwright
  # image, which has no Rust toolchain, so they download these files instead of building.
  e2e-build:
    name: E2E build (web UI, CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: e2e
      # The binary embeds web/dist, so the web UI is built first. The phone backend is the Rust test
      # `monitor_phone_serve`, which the specs start; its binary is built here too (see global-setup.ts).
      - name: Build the web UI and the binaries
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          cargo build --locked
          cargo test --locked --test monitor_phone_serve --no-run --message-format=json > build.json
          mkdir e2e-bin
          cp target/debug/agpj e2e-bin/agpj
          jq -r 'select(.executable != null and .target.name == "monitor_phone_serve") | .executable' build.json | tail -n 1 | xargs -I{} cp {} e2e-bin/monitor_phone_serve
          ls -l e2e-bin
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-bin
          path: e2e-bin
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (Playwright ${{ matrix.shard }}/5)
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The Playwright image holds the browsers and their system libraries.
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      # global-setup.ts uses the downloaded binaries instead of building.
      AGPJ_E2E_PREBUILT: "1"
      AGPJ_E2E_BINARY: ${{ github.workspace }}/e2e-bin/agpj
      AGPJ_E2E_PHONE_BACKEND: ${{ github.workspace }}/e2e-bin/monitor_phone_serve
    # The suite is split across five runners. Each shard runs a quarter of the tests.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: e2e-bin
          path: e2e-bin
      # An artifact does not keep the executable bit.
      - run: chmod +x e2e-bin/agpj e2e-bin/monitor_phone_serve
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile
      # Each worker starts its own `agpj serve` on port 0 with its own temporary data area.
      - run: pnpm --dir e2e test --shard=${{ matrix.shard }}/5
      - name: Find the results folder
        if: failure()
        id: results
        run: echo "dir=$(node -e "const c=require('node:crypto').createHash('sha256').update(process.cwd()).digest('hex').slice(0,8);console.log(require('node:path').join(require('node:os').tmpdir(),'agent-project-e2e-results-'+c))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: ${{ steps.results.outputs.dir }}
          if-no-files-found: ignore
          retention-days: 7

  # Retakes the README and guide images and the demo videos on main, once everything above has
  # passed, and lets the "agpj-images" GitHub App push them when they visibly changed (see
  # docs/dev/docs-and-images.md#automatic-retake-on-main). It never runs on a pull request.
  #
  # Loop guard: the App's push starts this workflow again, so the job is skipped when the actor
  # is the App. Even without that, the retake of the bot's own commit finds no visible change
  # (the captures are deterministic), so nothing is pushed.
  retake-media:
    name: Retake images and videos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'agpj-images[bot]'
    needs: [rust, web, coverage, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Two retakes never race: a later one waits for the one in progress.
    concurrency:
      group: retake-media
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push below authenticates with the App token, not the workflow token.
          persist-credentials: false
      - name: Set the capture folder
        run: |
          echo "AGPJ_MEDIA_OUT=$RUNNER_TEMP/captures" >> "$GITHUB_ENV"
          echo "AGPJ_E2E_BINARY=$RUNNER_TEMP/e2e-bin/agpj" >> "$GITHUB_ENV"
          echo "AGPJ_E2E_PHONE_BACKEND=$RUNNER_TEMP/e2e-bin/monitor_phone_serve" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: e2e-bin
          # Outside the worktree, so the path guard below does not see the binaries.
          path: ${{ runner.temp }}/e2e-bin
      - run: chmod +x "$AGPJ_E2E_BINARY" "$AGPJ_E2E_PHONE_BACKEND"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      # The demo videos are encoded and compared with ffmpeg and ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Capture the images and videos
        run: |
          node e2e/scripts/readme-screenshots.mjs
          node e2e/scripts/docs-screenshots.mjs
          node e2e/scripts/demo-video.mjs
      # Exit code 0: nothing visibly changed. 1: something did. Anything else is an error.
      - name: Compare with the committed files
        id: compare
        run: |
          set +e
          node e2e/scripts/compare-captures.mjs --captured "$AGPJ_MEDIA_OUT" --image-tolerance 4 --json > "$RUNNER_TEMP/changed.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/changed.json"
          case "$code" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "The comparison failed with exit code $code." >&2; exit "$code" ;;
          esac
      - name: Copy the changed files into place
        if: steps.compare.outputs.changed == 'true'
        # --apply still exits 1 when it copies something, so 0 and 1 both mean it worked.
        run: |
          set +e
          node e2e/scripts/compare-captures.mjs --captured "$AGPJ_MEDIA_OUT" --image-tolerance 4 --apply
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "Applying the captures failed with exit code $code." >&2
            exit "$code"
          fi
      # Path guard: only images and videos may be committed. Anything else that changed
      # (a script that wrote a file, a stray download) fails the job before the push.
      - name: Check that only images and videos changed
        if: steps.compare.outputs.changed == 'true'
        run: |
          paths="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          echo "$paths"
          if [ -z "$paths" ]; then
            echo "The comparison reported a change but no file differs." >&2
            exit 1
          fi
          other="$(printf '%s\n' "$paths" | grep -Ev '^(docs/images/|docs/public/videos/)' || true)"
          if [ -n "$other" ]; then
            echo "Files outside docs/images/ and docs/public/videos/ changed; nothing is pushed:" >&2
            printf '%s\n' "$other" >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        if: steps.compare.outputs.changed == 'true'
        with:
          app-id: ${{ secrets.AUTO_IMAGES_APP_ID }}
          private-key: ${{ secrets.AUTO_IMAGES_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and push to main
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved past $GITHUB_SHA; leaving the retake to the run for the newer commit."
            exit 0
          fi
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -- docs/images docs/public/videos
          git commit -m "docs: retake the images and videos" -m "Retaken from ${GITHUB_SHA}."
          if ! git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "::warning::The push was rejected (main moved or the App is not allowed to push). The next run retakes the images."
          fi
